<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Game Hub</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="alternate icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<meta name="theme-color" content="#0f131c" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('hub.theme') || 'midnight';
      var lightIds = { corporate: 1, matcha: 1, lavender: 1, sunset: 1, sakura: 1, retro: 1 };
      var active = saved;
      if (saved === 'auto') {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        active = prefersDark ? 'midnight' : 'corporate';
      }
      if (active && active !== 'midnight') {
        document.documentElement.setAttribute('data-theme', active);
      }
      var scheme = lightIds[active] ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme-scheme', scheme);
      document.documentElement.style.colorScheme = scheme;
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/static/css/app.css" />
<link rel="stylesheet" href="/static/css/themes.css" />
<link rel="stylesheet" href="/static/css/apps.css" />
<link rel="stylesheet" href="/static/css/poker.css" />
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a class="brand-link grow" href="#/home" id="brandLink" aria-label="Game Hub">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="11" x2="10" y2="11" />
            <line x1="8" y1="9" x2="8" y2="13" />
            <circle cx="15.5" cy="12.2" r="0.9" fill="currentColor" stroke="none" />
            <circle cx="18" cy="10.2" r="0.9" fill="currentColor" stroke="none" />
            <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5Z" />
          </svg>
        </div>
        <div class="grow" style="min-width:0">
          <div class="brand-name">Game Hub</div>
          <div class="brand-conn tiny muted" id="connLabel"><span class="conn-dot"></span><span class="conn-text">đang kết nối…</span></div>
        </div>
      </a>
      <button class="lang-pill" id="langBtn" type="button" title="Đổi ngôn ngữ (Tiếng Việt / English)">VI</button>
    </div>

    <nav class="nav" id="nav" aria-label="Ứng dụng"></nav>

    <div class="side-section">
      <div class="side-title" id="onlineHeader">Đang online (<span id="onlineCount">0</span>)</div>
      <div class="presence-list" id="presenceList"></div>
    </div>

    <div class="me-card" id="meCard">
      <button class="me-profile-btn grow" id="meProfileBtn" type="button" title="Hồ sơ & Cài đặt">
        <div class="avatar" id="meAvatar">?</div>
        <div class="grow nowrap" style="text-align:left">
          <div class="nowrap" id="meName" style="font-weight:600"></div>
          <div class="tiny muted" id="thisIsYou">Đây là bạn</div>
        </div>
      </button>
      <button class="icon ghost" id="settingsBtn" title="Cài đặt" aria-label="Cài đặt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
        </svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon ghost sidebar-toggle" id="navToggle" aria-label="Mở menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>
      <div class="grow" id="topbarSlot"></div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="nav-scrim" id="navScrim" aria-hidden="true"></div>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="notices" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>
<div id="popoverRoot"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
