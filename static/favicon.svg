<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Game Hub">
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="32" y2="32"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="0.52" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="gh-sheen" x1="16" y1="0" x2="16" y2="18"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Nền squircle gradient hiện đại -->
  <rect width="32" height="32" rx="8" fill="url(#gh-bg)" />
  <rect width="32" height="18" rx="8" fill="url(#gh-sheen)" />
  <rect x="0.7" y="0.7" width="30.6" height="30.6" rx="7.3" fill="none"
        stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" />

  <!-- Thân tay cầm chơi game sắc nét ở mọi cỡ (kể cả 16x16) -->
  <path d="M 9.6 9.3
           L 22.4 9.3
           C 25.5 9.3, 27.6 12.4, 27.4 17.7
           C 27.2 21.6, 25.4 23.4, 23.6 23.4
           C 22.1 23.4, 21.0 22.2, 19.7 19.9
           C 19.1 18.8, 18.3 18.5, 16.0 18.5
           C 13.7 18.5, 12.9 18.8, 12.3 19.9
           C 11.0 22.2, 9.9 23.4, 8.4 23.4
           C 6.6 23.4, 4.8 21.6, 4.6 17.7
           C 4.4 12.4, 6.5 9.3, 9.6 9.3 Z"
        fill="#ffffff" />

  <!-- Cụm D-pad trái -->
  <rect x="8.3" y="13.35" width="4.6" height="1.7" rx="0.7" fill="#4338ca" />
  <rect x="9.75" y="11.9" width="1.7" height="4.6" rx="0.7" fill="#4338ca" />

  <!-- Thanh giữa -->
  <rect x="14.7" y="13.55" width="2.6" height="1.2" rx="0.6" fill="#a5b4fc" />

  <!-- Hai nút bấm nổi bật bên phải -->
  <circle cx="22.1" cy="12.8" r="1.5" fill="#06b6d4" />
  <circle cx="19.6" cy="15.3" r="1.5" fill="#ec4899" />
</svg>
