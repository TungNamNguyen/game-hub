name: Render Keep-Alive Ping

on:
  schedule:
    # Ping mỗi 10 phút (< 15 phút giới hạn ngủ đông của Render Free)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /healthz endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Chưa cấu hình Secret RENDER_URL -> Bỏ qua."
            exit 0
          fi
          TARGET="${RENDER_URL%/}/healthz"
          echo "Pinging /healthz endpoint..."
          curl -fsS -m 20 -A "GitHubActions-KeepAlive/1.0" "$TARGET"
          echo ""
